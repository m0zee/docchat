name: docchat

x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    target: development
  image: docchat-app:local

services:
  app:
    <<: *app-image
    ports:
      - "${APP_PORT:-8000}:8080"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-docchat}
      POSTGRES_USER: ${DB_USERNAME:-docchat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:-n8n-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-create-testing-db.sql:ro
      - ./docker/postgres/init-n8n.sh:/docker-entrypoint-initdb.d/20-create-n8n-db.sh:ro
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-docchat} -d ${DB_DATABASE:-docchat}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    <<: *app-image
    command: ["php", "artisan", "queue:listen", "--tries=3", "--timeout=300"]
    healthcheck:
      disable: true
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Automations (Google Drive, Telegram, WhatsApp). Open http://localhost:5678.
  # For webhooks from the internet, point WEBHOOK_URL at a tunnel (n8n/README.md).
  n8n:
    image: n8nio/n8n:2.49.5
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n-secret}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-dev-only-change-me}
      N8N_LISTEN_ADDRESS: 0.0.0.0
      GENERIC_TIMEZONE: Asia/Karachi
      TZ: Asia/Karachi
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # The workflows in n8n/ read these. Code nodes may read env vars and use
      # node's crypto module to check DocChat's webhook signatures.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      DOCCHAT_API_URL: ${DOCCHAT_API_URL:-http://app:8080}
      DOCCHAT_WEBHOOK_SECRET: ${DOCCHAT_WEBHOOK_SECRET:-}
      DOCCHAT_NOTIFY_EMAIL: ${DOCCHAT_NOTIFY_EMAIL:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      DOCCHAT_CHANNEL_WEBHOOK_SECRET: ${DOCCHAT_CHANNEL_WEBHOOK_SECRET:-}
      # How DocChat reaches n8n for eval callbacks.
      DOCCHAT_CALLBACK_BASE_URL: ${DOCCHAT_CALLBACK_BASE_URL:-http://n8n:5678}
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      # Reach DocChat running outside Docker (Laragon, artisan serve).
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  vite:
    image: node:24-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
      VITE_HMR_PORT: ${VITE_PORT:-5173}
    restart: unless-stopped

volumes:
  pgdata:
  vendor:
  node_modules:
  n8n_data:
