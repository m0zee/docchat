# Production stack for one Ubuntu server (Oracle Cloud Always Free, arm64).
#   docker compose -f docker-compose.prod.yml up -d --build
# Reads .env in this folder (copy .env.production.example). See deploy.md.
name: docchat

x-env: &env
  APP_ENV: production
  APP_DEBUG: "false"
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  QUEUE_CONNECTION: database

x-app: &app
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    target: production
  image: docchat-app:production
  env_file: .env
  volumes:
    # Uploads, logs and framework caches survive rebuilds.
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      <<: *env
      # Only the web container runs migrations and warms caches on start.
      AUTORUN_ENABLED: "true"
    expose:
      - "8080"

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=300", "--max-time=3600", "--sleep=3"]
    environment:
      <<: *env
      AUTORUN_ENABLED: "false"
    healthcheck:
      disable: true
    # Let a running ingestion job finish before the container stops.
    stop_signal: SIGTERM
    stop_grace_period: 330s

  # Runs scheduled tasks (pruning stale cached answers).
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *env
      AUTORUN_ENABLED: "false"
    healthcheck:
      disable: true

  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-docchat}
      POSTGRES_USER: ${DB_USERNAME:-docchat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-n8n.sh:/docker-entrypoint-initdb.d/20-create-n8n-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-docchat} -d ${DB_DATABASE:-docchat}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Automations: n8n with its own database on the same Postgres server.
  # Served by Caddy at https://n8n.<your domain>. Optional: remove this
  # service (and its Caddy site) if you don't use n8n.
  n8n:
    image: n8nio/n8n:2.49.5
    expose:
      - "5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_LISTEN_ADDRESS: 0.0.0.0
      GENERIC_TIMEZONE: Asia/Karachi
      TZ: Asia/Karachi
      N8N_HOST: ${N8N_DOMAIN:-n8n.${DOCCHAT_DOMAIN}}
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: "1"
      WEBHOOK_URL: https://${N8N_DOMAIN:-n8n.${DOCCHAT_DOMAIN}}/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # The workflows in n8n/ read these. Code nodes may read env vars and use
      # node's crypto module to check DocChat's webhook signatures.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      DOCCHAT_API_URL: ${DOCCHAT_API_URL:-http://app:8080}
      DOCCHAT_WEBHOOK_SECRET: ${DOCCHAT_WEBHOOK_SECRET:-}
      DOCCHAT_NOTIFY_EMAIL: ${DOCCHAT_NOTIFY_EMAIL:-}
      # How DocChat reaches n8n for eval callbacks.
      DOCCHAT_CALLBACK_BASE_URL: ${DOCCHAT_CALLBACK_BASE_URL:-http://n8n:5678}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.11.9
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOCCHAT_DOMAIN: ${DOCCHAT_DOMAIN:?Set DOCCHAT_DOMAIN in .env}
      N8N_DOMAIN: ${N8N_DOMAIN:-n8n.${DOCCHAT_DOMAIN}}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
  n8n_data:
