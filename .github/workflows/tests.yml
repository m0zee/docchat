name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_DB: docchat_testing
          POSTGRES_USER: docchat
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docchat -d docchat_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: docchat_testing
      DB_USERNAME: docchat
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  # Drives the real app in Chromium, so a break between Blade/Livewire and the
  # browser (which Pest can't see) fails CI.
  app-browser:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_DB: docchat
          POSTGRES_USER: docchat
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docchat -d docchat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: docchat
      DB_USERNAME: docchat
      DB_PASSWORD: secret
      APP_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Application
        run: composer setup

      # The demo user and sample document; no worker runs, so nothing calls an AI API.
      - name: Seed the demo user
        run: php artisan db:seed --class=SampleDocumentSeeder --force

      - name: Install Playwright and Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Upload a document in a browser
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > serve.log 2>&1 &
          timeout 30 sh -c 'until curl -sf http://127.0.0.1:8000/login > /dev/null; do sleep 1; done'
          BASE_URL=http://127.0.0.1:8000 NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/browser/document-upload.cjs || { cat serve.log; tail -n 50 storage/logs/laravel.log; exit 1; }

  production-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the production image
        run: docker build --target production -f docker/app/Dockerfile -t docchat-app:production .

      - name: Check the image has no dev packages and boots Laravel
        run: |
          docker run --rm --entrypoint "" -e APP_KEY="base64:$(head -c 32 /dev/urandom | base64)" docchat-app:production sh -exc '
            test ! -d vendor/pestphp
            test ! -d vendor/phpstan/phpstan
            test -f public/build/manifest.json
            php artisan about --only=environment
          '

      - name: Validate the production compose file
        run: |
          cp .env.production.example .env
          docker compose -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.yml config -q

  n8n-workflows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Import every workflow into the pinned n8n version
        run: |
          image=$(grep -m1 -o 'n8nio/n8n:[0-9.]*' docker-compose.yml)
          docker run --rm -e N8N_DIAGNOSTICS_ENABLED=false -v "$PWD/n8n:/workflows:ro" "$image" \
            import:workflow --separate --input=/workflows 2>&1 | tee import.log
          grep -q "Successfully imported $(ls n8n/*.json | wc -l) workflows" import.log

  widget-browser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Playwright is installed outside the project, only for this check.
      - name: Install Playwright and Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Check the widget in a browser
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/browser/widget.cjs

      - name: Check voice calls in a browser (fake microphone)
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/browser/voice-call.cjs

      - name: Check the voice consent recorder in a browser (fake microphone)
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/browser/voice-consent.cjs
