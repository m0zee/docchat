name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_DB: docchat_testing
          POSTGRES_USER: docchat
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docchat -d docchat_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: docchat_testing
      DB_USERNAME: docchat
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  production-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the production image
        run: docker build --target production -f docker/app/Dockerfile -t docchat-app:production .

      - name: Check the image has no dev packages and boots Laravel
        run: |
          docker run --rm --entrypoint "" -e APP_KEY="base64:$(head -c 32 /dev/urandom | base64)" docchat-app:production sh -exc '
            test ! -d vendor/pestphp
            test ! -d vendor/phpstan/phpstan
            test -f public/build/manifest.json
            php artisan about --only=environment
          '

      - name: Validate the production compose file
        run: |
          cp .env.production.example .env
          docker compose -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.yml config -q

  n8n-workflows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Import every workflow into the pinned n8n version
        run: |
          image=$(grep -m1 -o 'n8nio/n8n:[0-9.]*' docker-compose.yml)
          docker run --rm -e N8N_DIAGNOSTICS_ENABLED=false -v "$PWD/n8n:/workflows:ro" "$image" \
            import:workflow --separate --input=/workflows 2>&1 | tee import.log
          grep -q "Successfully imported $(ls n8n/*.json | wc -l) workflows" import.log
